name: Telegram test

on:
  schedule:
    - cron: "55 12 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Check one specific date (YYYY-MM-DD). Leave empty to check +2 and +1 days."
        required: false
        default: ""
      style:
        description: "Wording to preview when a date is typed"
        type: choice
        options:
          - plain
          - 48h
          - 24h
        default: plain
      send_live:
        description: "Tick to really send to the doctors. Unticked = only a preview to you."
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find who is on duty and send
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
          DOCTOR_CHAT_IDS: ${{ secrets.DOCTOR_CHAT_IDS }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          STYLE: ${{ github.event.inputs.style }}
          SEND_LIVE: ${{ github.event.inputs.send_live }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 send_reminders.py
